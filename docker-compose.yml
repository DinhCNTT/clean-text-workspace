version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: clean-text-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: clean-text-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clean-text-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/clean-text
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clean-text-frontend
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: clean-text-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: clean-text-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - app-network

volumes:
  mongo-data:
  redis-data:
  grafana-data:

networks:
  app-network:
    driver: bridge
